<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React App</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Since we are in this environment using the CDN, JSX will not work here. We have to compile it with Babel. -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Babel requirement -->
  </head>
  <body>
    <div id="root"></div>

    <!-- To use a Babel we need to add a type to our script tag. Now, we can use JSX in our file -->

    <!-- We can see that using JSX is much easier. But under the hood, it is still using the createElement. -->
    <script type="text/babel">
      function Header() {
        return (
          <header>
            <h2>App Header</h2>
          </header>
        );
      }

      // We can also make this dynamic:
      // so we can write regular javascript in Component
      function App() {
        // variable name
        const name = "John";
        const member = true;

        // We can put any kind of JS above return
        //  but we cannot put ifs into return. ()
        //
        // Ak to vracia hodnotu (expression), môže ísť do {} .
        // Ak je to riadiaci príkaz (if, for, while), patrí nad return.

        return (
          <>
            <Header />

            {/*For is also reserved word, so we need to use htmlFor instead*/}
            <label htmlFor="title">Title</label>

            {/* / and here if we can add something dynamic we use curly braces {} */}
            <h1 className="title">Hello, {name}</h1>

            {/*Class is reserved word in JSX, so we cant use this attribute. 
            Instead We simply use className*/}

            {/* We can have here also a ternary operations */}
            {member ? <p>Welcome Back</p> : <p>Join Us!</p>}

            {/*We can use Short Circuit Evaluation*/}
            {member && <p>Welcome Back</p>}
          </>
        );
      }

      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(React.createElement(App));
    </script>
  </body>
</html>
